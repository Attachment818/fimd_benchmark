name: fimd_geoformer
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.7
  # PyTorch 1.13 libtorch_cpu requires the legacy iJIT symbol removed by MKL 2024.1+.
  - mkl=2024.0
  - numpy=1.23.5
  - scipy=1.9.3
  - scikit-image=0.19.3
  - pillow=9.2
  - pip
  - pip:
      - opencv-python==4.6.0.66
      - imgaug==0.4.0
      - kornia==0.6.12
      - yacs==0.1.8
      - einops==0.6.1
      - tqdm==4.64.0
      - PyYAML==6.0
